name: ci
on:
  push: { branches: [main, 'v2/**', 'dev/**'] }
  pull_request:
jobs:
  legacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --ignore-scripts
      - run: npm run preflight
      - run: npm run test:unit
  v2:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: grimore_dev }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/grimore_dev
      REDIS_URL: redis://localhost:6379
      SESSION_SECRET: ci-only-secret
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: node scripts/guards.js
      - run: pnpm -r --filter './packages/*' run build
      - run: pnpm -r --filter './packages/*' --filter './apps/*' run typecheck
      - run: pnpm -r --filter './packages/*' --filter '@grimore/api' run test
      # apps/realtime Redis-backed tests: pending (see claude/phase0-progress-2026-09-13.md)
