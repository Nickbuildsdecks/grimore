name: ci
on:
  push: { branches: [main, 'v2/**', 'dev/**'] }
  pull_request:
jobs:
  legacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: npm ci --ignore-scripts
      - run: npm run preflight
      - run: npm run test:unit
  # The legacy job above runs server.js on SQLite. Production runs it on Postgres, and db.js builds a
  # *different* table under the same name for each dialect -- so a route can be green there and 500
  # for every real user. This job is the only place the legacy server is exercised on the dialect it
  # actually ships on. See claude/postgres-schema-gap-2026-09-27.md.
  legacy-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: grimore_dev }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_TEST_URL: postgresql://postgres:postgres@localhost:5432/grimore_dev
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      # Not --ignore-scripts, unlike the legacy job: db.js requires better-sqlite3 unconditionally
      # at load time, and its native binding is fetched by an install script.
      - run: npm ci
      - run: npm run test:postgres

  v2:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: grimore_dev }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/grimore_dev
      REDIS_URL: redis://localhost:6379
      SESSION_SECRET: ci-only-secret
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6  # version comes from package.json packageManager
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: node scripts/guards.js
      - run: pnpm -r --filter './packages/*' run build
      - run: pnpm -r --filter './packages/*' --filter './apps/*' run typecheck
      # The test files, which `typecheck` deliberately excludes and vitest only transpiles. This
      # step exists because the script did not: rules-engine has had `typecheck:tests` since the
      # suite was written, nothing ever ran it, and by the time anybody looked it was 22 errors
      # deep -- one of which was an assertion reading `seat.energy`, a field that does not exist,
      # so it compared `undefined ?? 0` against 0 and passed on any board (D263). A recursive run
      # skips packages without the script, so this covers whichever of them grows one.
      - run: pnpm -r --filter './packages/*' --filter './apps/*' run typecheck:tests
      - run: pnpm -r --filter './packages/*' --filter './apps/*' run test
      # The legacy job runs this too, but skips it: the parity check needs packages/shared built, which
      # only this job does. It is the guard that the duplicated CommonJS copies of the token discipline
      # and the password policy have not drifted from the TypeScript originals, so it must actually run
      # somewhere.
      - run: node --test test/account-tokens-parity.test.js
      - run: pnpm --filter @grimore/web build

  # Two real browsers playing a game through the actual UI, which no other job does. #245 found these
  # suites were outside every gate and D302 made them count their own skips, but they still ran only
  # when somebody remembered to run them -- and the one thing they check is the one thing the Play
  # Realm is for. Measured before adding them rather than assumed: e2e-table is 29s and
  # check-table-controls 11s on this hardware, so the run is cheap and the Chromium download is most
  # of the job's wall clock.
  #
  # Only the two fast suites. e2e-arena and e2e-pod drive more browsers for longer and e2e-solo has
  # twenty LIST=* arms; those stay manual until this job has proved stable, because a browser job
  # that flakes gets ignored and then deleted.
  browser:
    # Pinned, unlike every other job here, and the first run of this job is why. `ubuntu-latest` is
    # now Ubuntu 26.04, and Playwright 1.56.1 refuses it outright:
    #
    #   BEWARE: your OS is not officially supported by Playwright; installing dependencies for
    #   ubuntu26.04-x64 as a fallback.
    #   Cannot install dependencies for ubuntu26.04-x64 with Playwright 1.56.1!
    #   Error: ERROR: Playwright does not support chromium on ubuntu26.04-x64
    #
    # So the runner and the Playwright version are a matched pair, and both are pinned rather than
    # one of them floating. When this is bumped, bump them together and watch the install step.
    runs-on: ubuntu-24.04
    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      REDIS_URL: redis://127.0.0.1:6379
      # play.mjs binds to the address it prints, and the drivers connect to 127.0.0.1.
      PLAY_HOST: 127.0.0.1
      # The drivers resolve playwright from wherever it lives (they take no dependency on it, since
      # it ships a browser); this is where the install step below puts it. A wrong value here is
      # harmless rather than fatal: loadPlaywright try/catches each candidate and falls through to a
      # bare `playwright` specifier.
      PLAYWRIGHT_PATH: /tmp/pw/node_modules/playwright/index.js
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Pinned, and deliberately not added to package.json: playwright is a test tool that ships a
      # ~130MB browser, and making it a workspace dependency puts that download in front of every
      # `pnpm install` anybody runs.
      #
      # Installed **outside the repository** on purpose. `npm i` inside a pnpm workspace root writes
      # into a node_modules that pnpm owns and lays out differently, which is a good way to break the
      # install that the rest of this job depends on.
      - name: Install playwright and Chromium
        run: |
          mkdir -p /tmp/pw
          cd /tmp/pw
          npm i --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      # The drivers import the engine's dist (through scripts/lib/engine.mjs, which warns if it is
      # stale), so it has to exist before they run.
      - run: pnpm -r --filter './packages/*' run build
      - name: Start the Play Realm
        run: |
          node scripts/play.mjs > /tmp/play.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:5100/react/play > /dev/null; then echo "up after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "the Play Realm did not come up; its log follows"
          cat /tmp/play.log
          exit 1
      - run: node scripts/e2e-table.mjs
      - run: node scripts/check-table-controls.mjs
      # Hybrid automation: the engine runs a deck holding cards it has no script for, and marks
      # them. This is the check that has to hold as the pool grows towards every printed card, so
      # it belongs in CI rather than in a local sweep — see scripts/check-hybrid.mjs.
      - run: node scripts/check-hybrid.mjs
      # The screenshots are how a failure gets diagnosed without a browser to hand.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-shots
          path: e2e-shots/
          if-no-files-found: ignore
      # `|| true`, because this step is diagnostics. Without it a missing log file is a *second*
      # failure on top of the real one, which is how the first run of this job reported
      # `cat: /tmp/play.log: No such file or directory` underneath the error that actually mattered.
      - if: failure()
        run: cat /tmp/play.log || true
