services:
  app:
    build: .
    container_name: grimore-app
    restart: always
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - ./data:/data
    # Load the VM-side .env (never shipped in the deploy zip) so real secrets reach the
    # container. Without this, SESSION_SECRET/GEMINI_API_KEY were unset in production:
    # the session secret fell back to a committed string and the Gemini advisor ran as a stub.
    env_file:
      - .env
    environment:
      - PORT=3000
      - NODE_ENV=production
      - MOXFIELD_USER_AGENT=${MOXFIELD_USER_AGENT}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - SESSION_SECRET=${SESSION_SECRET}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ADMIN_USER=${ADMIN_USER}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - POSTGRES_URL=postgres://grimore_user:${POSTGRES_PASSWORD:-grimore_password_99}@postgres:5432/grimore_db
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # The v2 API. NOT started by `docker compose up -d` -- it is behind a profile, so bringing it up
  # is always explicit:
  #
  #     docker compose --profile v2 up -d api
  #
  # Two reasons it is gated rather than default:
  #
  #  1. Starting it runs migrations 0002-0012 against whatever DATABASE_URL it is given. None of
  #     them have ever run on the VM, and 0012 rewrites a password hash. Against production that is
  #     a one-way door and wants a backup taken first.
  #  2. `deploy-gcp.ps1` does not ship `apps/api`, `packages/` or the pnpm lockfile, so the build
  #     context on the VM is currently incomplete. Enabling this profile needs that change too.
  #
  # Nothing routes to it: the Caddyfile is untouched, so it is reachable only from inside the
  # compose network until someone deliberately points traffic at it.
  #
  # See claude/v2-deploy-notes.md for the cutover sequence.
  api:
    profiles: ["v2"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: grimore-api
    restart: always
    expose:
      - "3000"
    env_file:
      - .env
    environment:
      - PORT=3000
      - NODE_ENV=production
      # apps/api reads DATABASE_URL; the legacy app reads POSTGRES_URL. Same database, different
      # variable names, so both can run side by side during the migration.
      - DATABASE_URL=postgres://grimore_user:${POSTGRES_PASSWORD:-grimore_password_99}@postgres:5432/grimore_db
      - REDIS_URL=redis://redis:6379
      - SESSION_SECRET=${SESSION_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - ADMIN_GOOGLE_EMAILS=${ADMIN_GOOGLE_EMAILS}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: grimore-postgres
    restart: always
    environment:
      POSTGRES_USER: grimore_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-grimore_password_99}
      POSTGRES_DB: grimore_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grimore_user -d grimore_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: grimore-redis
    restart: always
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    container_name: grimore-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - VM_IP=${VM_IP}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
