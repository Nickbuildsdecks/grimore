<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <linearGradient id="vibrant-magic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <linearGradient id="vibrant-gold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
    <filter id="bold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Solid Dark Background Plate -->
  <rect width="100" height="100" fill="#090a10" />

  <!-- Thick Outer Sigil Ring -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="url(#vibrant-magic)" stroke-width="4.5" filter="url(#bold-glow)" />
  <circle cx="50" cy="50" r="36" fill="none" stroke="url(#vibrant-magic)" stroke-width="2" opacity="0.7" />

  <!-- Bold Grimoire Open Book Pages -->
  <!-- Left Page -->
  <path d="M 50,68 C 41,68 31,64 24,61 L 24,36 C 31,39 41,43 50,43 Z" fill="#131522" stroke="url(#vibrant-magic)" stroke-width="4.5" stroke-linejoin="round" />
  <!-- Right Page -->
  <path d="M 50,68 C 59,68 69,64 76,61 L 76,36 C 69,39 59,43 50,43 Z" fill="#131522" stroke="url(#vibrant-magic)" stroke-width="4.5" stroke-linejoin="round" />

  <!-- Thick Gold Book Spine -->
  <line x1="50" y1="43" x2="50" y2="68" stroke="url(#vibrant-gold)" stroke-width="4" stroke-linecap="round" />

  <!-- Top Center Bold Spark Diamond -->
  <path d="M 50,16 L 55,24 L 50,32 L 45,24 Z" fill="url(#vibrant-gold)" filter="url(#bold-glow)" />

  <!-- Side Spark Diamonds -->
  <path d="M 34,26 L 37,29 L 34,32 L 31,29 Z" fill="url(#vibrant-magic)" />
  <path d="M 66,26 L 69,29 L 66,32 L 63,29 Z" fill="url(#vibrant-magic)" />
</svg>